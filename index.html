tendent (satisfaction de tous \u2212${sr(e.plan.penurie||1)} par trimestre). Il faut r\xE9duire le d\xE9ficit d'urgence.`:"Commune populaire : plein emploi garanti et prix administr\xE9s. Tant que le d\xE9ficit reste sous 5 %, les rayons restent pleins."},{id:"pp-mauvais",type:"analyse",badge:"D\xC9CRYPTAGE",si:e=>e.pp&&e.pp.cote<0,poids:e=>6-e.pp.cote*20,texte:e=>`Pleins pouvoirs : la cote du r\xE9gime est \xE0 ${Xa(e.pp.cote*100)} points. R\xE9tablir l'ordre parlementaire rapporterait +10 points d'un coup.`},{id:"pp-bon",type:"analyse",badge:"D\xC9CRYPTAGE",si:e=>e.pp&&e.pp.cote>=0,poids:()=>3,texte:()=>"Le r\xE9gime fort redresse le pays : tant que croissance, emploi et niveau de vie progressent, les d\xE9crets restent tol\xE9r\xE9s."},{id:"colere-groupe",type:"analyse",badge:"D\xC9CRYPTAGE",si:e=>e.colere.rad>=60,poids:e=>4+(e.colere.rad-60)/8,texte:e=>`${e.colere.nom} : radicalisation \xE0 ${Xa(e.colere.rad)}/100. \xC0 90, la gr\xE8ve g\xE9n\xE9rale part. Un geste cibl\xE9 sur ce groupe vaut mieux qu'une grande loi.`},{id:"tension",type:"analyse",badge:"D\xC9CRYPTAGE",si:e=>e.tension>=1,poids:e=>6+e.tension,texte:e=>`${e.libelleTension} : ordre public \xE0 ${Xa(e.ordrePublic)}/100. ${e.interieur?`${e.interieur} tient la place Beauvau.`:"Place Beauvau vacante : un ministre de l'Int\xE9rieur durcirait les seuils de gr\xE8ve."}`},{id:"ministre-vacant",type:"analyse",badge:"GOUVERNEMENT",si:e=>e.vacants.length>0,poids:e=>4+e.vacants.length,texte:e=>`Gouvernement incomplet : ${e.vacants.join(", ")} sans titulaire. Chaque ministre apporte un bonus permanent : onglet Conseil.`},{id:"ministre-fragile",type:"analyse",badge:"COULISSES",si:e=>e.fragile,poids:e=>6+(30-e.fragile.loyaute)/5,texte:e=>`Rumeurs de d\xE9mission ${e.fragile.lieu} : ${e.fragile.nom} n'est plus loyal${e.fragile.f?"e":""} qu'\xE0 ${Xa(e.fragile.loyaute)} %. Encore une loi contraire \xE0 sa ligne et ${e.fragile.f?"elle":"il"} claque la porte (\u22128 points).`},{id:"cohabitation",type:"analyse",badge:"MATIGNON",si:e=>e.pm&&e.pm.cohabitation,poids:()=>4,texte:e=>`Cohabitation : le ${e.pm.nom} retire 3 voix aux textes qui heurtent sa ligne. Les lois qu'il soutient gagnent 4 voix : elles passent plus facilement.`},{id:"note-matignon",type:"analyse",badge:"MATIGNON",si:e=>e.suggestion,poids:()=>4,texte:e=>`Matignon recommande \xAB ${e.suggestion.titre} \xBB : ${Xa(e.suggestion.chances*100)} % de chances d'adoption.`},{id:"presidentielle",type:"analyse",badge:"SONDAGE",si:e=>e.avantElection<=4&&e.democratie,poids:e=>5+(4-e.avantElection),texte:e=>`Pr\xE9sidentielle dans ${e.avantElection} trimestre${e.avantElection>1?"s":""} : vous \xEAtes \xE0 ${Xa(e.popularite*100)} %, il faut 50 %. ${e.popularite<.5?"Priorit\xE9 aux groupes nombreux : modestes, classe moyenne, retrait\xE9s.":"\xC9vitez les r\xE9formes qui f\xE2chent."}`},{id:"defi",type:"analyse",badge:"D\xC9FI",si:e=>e.defi&&!e.defi.atteint&&e.defi.reste<=2,poids:()=>5,texte:e=>`D\xE9fi de l'ann\xE9e \xAB ${e.defi.titre} \xBB : plus que ${e.defi.reste} trimestre${e.defi.reste>1?"s":""}, et la cible n'est pas atteinte.`},{id:"deficit-maitrise",type:"analyse",badge:"FLASH \xC9CO",si:e=>e.deficitPct<3,poids:()=>3,texte:e=>`Le d\xE9ficit est ramen\xE9 \xE0 ${ar(e.deficit)} par an, dans les clous europ\xE9ens : les pr\xEAteurs se d\xE9tendent, Bruxelles applaudit.`},{id:"peuplu",type:"trottoir",qui:"Jean Peuplu",role:"54 ans, au RSA",si:e=>e.g.pauvres.sat<45,poids:e=>5+(45-e.g.pauvres.sat)/5,texte:()=>"\xAB Le frigo est vide le 20 du mois. Une hausse des minima sociaux, c'est tout ce qu'on demande. \xBB"},{id:"peuplu-bien",type:"trottoir",qui:"Jean Peuplu",role:"54 ans, au RSA",si:e=>e.g.pauvres.sat>=60,poids:()=>2,texte:()=>"\xAB Pour une fois, je boucle le mois. Je n'en reviens pas, alors je reviens voter. \xBB"},{id:"croche",type:"trottoir",qui:"Sarah Croche",role:"38 ans, demandeuse d\u2019emploi",si:e=>e.chomage>8||e.g.chomeurs.sat<40,poids:e=>3+e.chomage/3,texte:e=>`\xAB ${Xa(e.chomeurs)} ch\xF4meurs pour 1 000
